[package]
name = "in-gen"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.83"
csv = "1.3.1"
csv-async = "1.3.0"
futures = "0.3"
rust_decimal = { version = "1.37.2", features = ["serde", "macros"] }
rustc-hash = "2.1.1"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
proptest = "1.0"
tempfile = "3.20.0"
